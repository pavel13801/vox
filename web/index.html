<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Vox</title>
  <meta name="description" content="ИИ-диктофон: запись, расшифровка Deepgram, сводки, задачи и чат по записям">
  <meta name="theme-color" content="#5b47e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vox">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view" tabindex="-1"></main>
    <div id="recbar" class="recbar hidden"></div>
    <nav id="tabs" class="tabs">
      <a href="#/" data-tab="home"><span>〰︎</span>Записи</a>
      <a href="#/tasks" data-tab="tasks"><span>☑︎</span>Задачи</a>
      <a href="#/chat" data-tab="chat"><span>💬</span>Чат</a>
      <a href="#/memory" data-tab="memory"><span>🧠</span>Память</a>
      <a href="#/settings" data-tab="settings"><span>⚙︎</span>Настройки</a>
    </nav>
  </div>
  <div id="modal-root" class="modal-root"></div>
  <noscript>Для работы Vox нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
