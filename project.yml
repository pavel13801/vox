name: Vox
options:
  bundleIdPrefix: com.pavel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

packages:
  Opus:
    url: https://github.com/alta/swift-opus
    revision: 6f3cb6bd3ffed1fe5f06d00a962d5c191a50daf8

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Vox:
    type: application
    platform: iOS
    sources:
      - path: Vox
    dependencies:
      - package: Opus
        product: Copus
    info:
      path: Vox/Info.plist
      properties:
        CFBundleDisplayName: Vox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
          - bluetooth-central
        NSMicrophoneUsageDescription: Vox записывает звук с микрофона, чтобы расшифровать ваши разговоры и диктовки.
        NSBluetoothAlwaysUsageDescription: Vox подключается к устройству Omi по Bluetooth, чтобы получать с него звук.
        NSBluetoothPeripheralUsageDescription: Vox подключается к устройству Omi по Bluetooth, чтобы получать с него звук.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavel.vox
        PRODUCT_NAME: Vox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_OPTIMIZATION_LEVEL: -O
